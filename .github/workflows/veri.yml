name: Veriyi derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: veri/ klasörünü data/sonuclar.json'a çevir
        run: node tools/veri-derle.mjs
      - name: Değiştiyse kaydet
        run: |
          if ! git diff --quiet -- data/; then
            git config user.name "kulvar-bot"
            git config user.email "kulvar-bot@users.noreply.github.com"
            git add data/
            git commit -m "Veri güncellendi"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
